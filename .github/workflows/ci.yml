name: eBPF Sentinel CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test-and-benchmark:
    name: Run Pytest & Kernel Systems Benchmark
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest Suite
        run: |
          python -m pytest tests -v

      - name: Execute High-Throughput Overhead Benchmark
        run: |
          python benchmarks/run_overhead_benchmark.py

      - name: Upload Benchmark Metrics Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ebpf-benchmark-metrics-python-${{ matrix.python-version }}
          path: benchmarks/benchmark_metrics.json
